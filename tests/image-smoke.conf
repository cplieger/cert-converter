# Per-app config for the shared image-smoke harness (tests/image-smoke.sh,
# synced from cplieger/ci). cert-converter has no network listener, so this is
# a health-gated test: it waits for the container HEALTHCHECK
# (CMD ["/cert-watcher","health"], start-period 15s / interval 30s) to report
# "healthy" - proving the binary runs in the distroless base, loads its config,
# completes the initial scan, and writes the /tmp/.healthy marker its `health`
# subcommand probes.
SMOKE_APP_NAME=cert-converter
# Must cover the 15s start-period + a few 30s healthcheck intervals.
SMOKE_TIMEOUT=90
# PFX_PASSWORD: config.Load exits 1 on an empty password unless
# PFX_ALLOW_EMPTY_PASSWORD=true; the value itself is unused here (an empty
# /input converts nothing). --tmpfs /input: the hardcoded watch root, absent
# from the distroless image, so without it the initial scan errors and the
# marker never flips healthy (an empty dir converts zero certs -> healthy).
# --tmpfs /output: the other hardcoded mount, so the startup stale-temp reap
# runs its real ReadDir instead of the missing-directory early return.
SMOKE_RUN_ARGS="-e PFX_PASSWORD=smoke-test --tmpfs /input --tmpfs /output"
