# Per-app config for the shared image-smoke harness (tests/image-smoke.sh,
# synced from cplieger/ci). cert-converter has no network listener, so the
# harness requires both the container HEALTHCHECK
# (CMD ["/cert-watcher","health"], start-period 15s / interval 30s) and a
# `wrote pfx` log from the generated fixture below. Together they prove the
# distroless image boots, loads its config, completes a real conversion, and
# exposes the healthy marker its `health` subcommand probes.
SMOKE_APP_NAME=cert-converter
# Must cover the 15s start-period plus all three 30s healthcheck retries
# (~105s), so a container that never writes the marker is reported by the
# harness's precise "unhealthy" verdict instead of racing its deadline.
SMOKE_TIMEOUT=120
# PFX_PASSWORD: config.Load exits 1 on an empty password unless
# PFX_ALLOW_EMPTY_PASSWORD=true, and here it is also the password the fixture
# pair below is really encoded with. The /input bind mount and --tmpfs /output:
# both hardcoded roots are absent from the distroless image, and volumesReady
# (main.go) stats each one before the watcher starts and refuses to start when
# either is missing or is not a directory, so dropping either mount makes the
# container exit 1 at startup and the harness reports that early exit (with the
# ERROR naming the path) rather than waiting out SMOKE_TIMEOUT on a
# never-healthy container. With both mounted, the initial scan converts the one
# fixture pair -> one "wrote pfx" record and a healthy marker, and the per-scan
# stale-temp reap walks the fresh output tree.
# The fixture below is generated per run (never committed: no private key enters
# the repo, so the gitleaks gate stays clean) and mounted read-only at /input, so
# the gate proves the shipped image actually CONVERTS - go-pkcs12 encode plus the
# atomicfile temp+rename into /output under the non-root UID the container runs
# as - instead of only proving that a zero-cert scan boots. Files are made
# world-readable and the directory traversable because the container runs as the
# UID below, not the runner's user; a fixture the scan cannot read is
# health-neutral (a WARN + skip), which would leave the container healthy while
# converting nothing. CA:FALSE shapes the fixture like the leaf certificates
# Caddy actually emits, so the gate log carries no "ca-as-identity" observation
# WARN that a reader would have to learn to ignore.
SMOKE_FIXTURE=$(mktemp -d)
# Release what the line above acquired: the harness's EXIT trap calls this after
# removing the container, and the fixture-generation failure path below calls it
# directly (the trap is armed only after this file is sourced), so no smoke run —
# local or CI — leaves a host directory holding a generated private key behind.
# shellcheck disable=SC2329  # invoked indirectly via the harness EXIT trap
smoke_cleanup() {
  rm -rf "$SMOKE_FIXTURE"
}
if ! openssl req -x509 -newkey rsa:2048 -noenc -days 1 -subj /CN=smoke.example \
  -addext basicConstraints=critical,CA:FALSE \
  -keyout "$SMOKE_FIXTURE/smoke.key" -out "$SMOKE_FIXTURE/smoke.crt" >/dev/null 2>&1; then
  # Sourced under `set -e`: without this the harness dies here with no output at all,
  # and the missing conversion assertion looks like a harness bug.
  printf 'FAIL: could not generate the smoke certificate fixture (openssl req failed)\n' >&2
  # The harness arms `trap cleanup EXIT` only after this file is sourced, so the
  # fixture (already created, possibly holding a partial key) must be released here
  # by hand; rm -rf is idempotent if the trap runs too.
  smoke_cleanup
  exit 1
fi
chmod 0755 "$SMOKE_FIXTURE"
chmod 0644 "$SMOKE_FIXTURE/smoke.crt" "$SMOKE_FIXTURE/smoke.key"
# --read-only + --cap-drop + --security-opt + --tmpfs /tmp: exercise the README's
# full "Hardened deployment" profile, so its one filesystem coupling (the
# /tmp/.healthy marker needing a writable /tmp once the rootfs is read-only) is
# proven rather than asserted, and a future capability dependency fails here
# instead of in the operator's copy of that block.
# --user 1000:1000: the compose example and README run the container under the
# operator's own UID (`user: "${PUID:-1000}:${PGID:-1000}"`), not the image's
# baked nonroot 65532, and that UID has no /etc/passwd entry in the distroless
# base. Asserting the documented shape here means a future dependency that
# needs a resolvable user or a HOME fails in CI instead of in the operator's
# copy of the quick start. The fixture above is world-readable and /output and
# /tmp are mounted mode 1777, so an arbitrary UID can still read every input and
# write both the bundles and the /tmp health marker.
SMOKE_RUN_ARGS="-e PFX_PASSWORD=smoke-test --user 1000:1000 -v ${SMOKE_FIXTURE}:/input:ro --tmpfs /output:size=4m,mode=1777 --read-only --cap-drop ALL --security-opt no-new-privileges:true --tmpfs /tmp:size=1m,mode=1777,noexec,nosuid,nodev"
# Health alone would pass on a zero-cert scan, so the verdict also requires the
# per-conversion INFO record from internal/process (slog.Info("wrote pfx", ...)).
SMOKE_LOG_PATTERN="wrote pfx"
