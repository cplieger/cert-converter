# Per-app config for the shared image-smoke harness (tests/image-smoke.sh,
# synced from cplieger/ci). cert-converter has no network listener, so the
# verdict is the container HEALTHCHECK plus a `wrote pfx` log from the generated
# fixture below; smoke_verify then opens the bundle with the configured
# password, plants a corrupt pair and asserts the failure is logged, produces no
# artifact and fails health, and removes it and asserts health recovers without
# a restart, so a conversion the image cannot do is proven to go unhealthy.
SMOKE_APP_NAME=cert-converter
# Must cover the worst case Docker needs to declare the container unhealthy:
# the 15s start-period, then three 30s intervals whose probes may each burn
# the baked --timeout=5s (~120s), plus the harness wait loop's own per-pass
# cost (sleep 1 + two docker inspect calls). Sized above that so a container
# that never writes the marker is reported by the harness's precise
# "unhealthy" verdict instead of racing its deadline.
SMOKE_TIMEOUT=150
# PFX_PASSWORD is required (config.Load exits 1 on an empty one) and is the
# password the fixture bundle is really encoded with. /input and /output are
# siblings under one generated directory because mounts.Overlap refuses a nested
# pair, and /output is a host directory rather than a tmpfs so smoke_verify can
# read the bundle back on the host. The fixture is generated per run so no
# private key enters the repo (gitleaks), and it is a real pair so the gate
# proves the image CONVERTS rather than that a zero-cert scan boots. CA:FALSE
# keeps the "ca-as-identity" observation WARN out of the gate log.
SMOKE_FIXTURE=$(mktemp -d)
# Release what the line above acquired: the harness's EXIT trap calls this after
# removing the container, and the fixture-generation failure path below calls it
# directly (the trap is armed only after this file is sourced), so no smoke run,
# local or CI, leaves a host directory holding a generated private key behind.
# shellcheck disable=SC2329  # invoked indirectly via the harness EXIT trap
smoke_cleanup() {
  rm -rf "$SMOKE_FIXTURE"
}
if ! mkdir "$SMOKE_FIXTURE/input" "$SMOKE_FIXTURE/output" \
  || ! openssl req -x509 -newkey rsa:2048 -noenc -days 1 -subj /CN=smoke.example \
    -addext basicConstraints=critical,CA:FALSE \
    -keyout "$SMOKE_FIXTURE/input/smoke.key" -out "$SMOKE_FIXTURE/input/smoke.crt" >/dev/null 2>&1; then
  # Sourced under `set -e`: without this the harness dies here with no output at all,
  # and the missing conversion assertion looks like a harness bug.
  printf 'FAIL: could not generate the smoke certificate fixture (openssl req failed)\n' >&2
  # The harness arms `trap cleanup EXIT` only after this file is sourced, so the
  # fixture (already created, possibly holding a partial key) must be released here
  # by hand; rm -rf is idempotent if the trap runs too.
  smoke_cleanup
  exit 1
fi
# The hardening flags are the README's "Hardened deployment" profile, so its one
# filesystem coupling (the /tmp/.healthy marker needs a writable /tmp on a
# read-only rootfs) is proven, and a new capability dependency fails here rather
# than in the operator's copy. --user runs the container as the invoking UID,
# which is what the compose example does (`user: "${PUID:-1000}:${PGID:-1000}"`,
# a UID with no /etc/passwd entry in the distroless base, not the baked 65532),
# and it lets the container read the fixture and smoke_verify read the 0600
# bundle with no chmod on either side.
SMOKE_RUN_ARGS="-e PFX_PASSWORD=smoke-test --user $(id -u):$(id -g) -v ${SMOKE_FIXTURE}/input:/input:ro -v ${SMOKE_FIXTURE}/output:/output --read-only --cap-drop ALL --security-opt no-new-privileges:true --tmpfs /tmp:size=1m,mode=1777,noexec,nosuid,nodev"
# Health alone would pass on a zero-cert scan, so the verdict also requires the
# per-conversion INFO record from internal/process (slog.Info("wrote pfx", ...)).
SMOKE_LOG_PATTERN="wrote pfx"

# Poll the container log for a fixed string. The json-file log driver can lag
# the writer, so a single grep can miss a line the container already wrote.
smoke_wait_for_log() {
  i=0
  while [ "$i" -lt 30 ]; do
    if docker logs "$SMOKE_CONTAINER" 2>&1 | grep -qF -- "$1"; then
      return 0
    fi
    i=$((i + 1))
    sleep 1
  done
  printf 'FAIL: %s\n' "$2" >&2
  return 1
}

# Poll the container's own health probe until it passes. The marker is written
# by the scan that follows a filesystem event after a 2s debounce, so the first
# probe after a change can legitimately still see the previous state.
smoke_wait_for_healthy() {
  i=0
  while [ "$i" -lt 30 ]; do
    if docker exec "$SMOKE_CONTAINER" /cert-watcher health >/dev/null 2>&1; then
      return 0
    fi
    i=$((i + 1))
    sleep 1
  done
  printf 'FAIL: %s\n' "$1" >&2
  return 1
}

# The failure direction of smoke_wait_for_healthy. The `scan complete` line is
# logged before the marker is removed, so a probe run the instant that line
# appears can still see the previous state.
smoke_wait_for_unhealthy() {
  i=0
  while [ "$i" -lt 30 ]; do
    if ! docker exec "$SMOKE_CONTAINER" /cert-watcher health >/dev/null 2>&1; then
      return 0
    fi
    i=$((i + 1))
    sleep 1
  done
  printf 'FAIL: %s\n' "$1" >&2
  return 1
}

smoke_verify() {
  bundle="$SMOKE_FIXTURE/output/smoke.pfx"
  # Flat layout (the default) keys a root-level source on its own stem, so the
  # fixture's bundle lands at /output/smoke.pfx.
  if ! subject=$(openssl pkcs12 -in "$bundle" -passin pass:smoke-test -nokeys -clcerts 2>/dev/null \
    | openssl x509 -noout -subject 2>&1); then
    printf 'FAIL: the bundle the image wrote at %s does not open with PFX_PASSWORD\n' "$bundle" >&2
    printf '%s\n' "$subject" >&2
    return 1
  fi
  case "$subject" in
    *smoke.example*) ;;
    *)
      printf 'FAIL: the bundle opened but does not hold the fixture certificate (subject: %s)\n' "$subject" >&2
      return 1
      ;;
  esac
  # The password is the only protection on the private key inside the bundle,
  # so a bundle a wrong password opens would be the worst possible output.
  if openssl pkcs12 -in "$bundle" -passin pass:not-the-password -noout >/dev/null 2>&1; then
    printf 'FAIL: the bundle opens with a wrong password; PFX_PASSWORD did not protect it\n' >&2
    return 1
  fi
  if ! docker exec "$SMOKE_CONTAINER" /cert-watcher health; then
    printf 'FAIL: health did not pass after a completed conversion\n' >&2
    return 1
  fi

  # Negative control. A PEM pair that parses as neither certificate nor key is
  # a conversion failure, the same class as a renewed certificate the image can
  # no longer encode. The bind mount is read-only inside the container only; the
  # host writes into the watched directory and fsnotify delivers the event to
  # the container's watch on the same inode.
  if ! printf 'not a certificate\n' >"$SMOKE_FIXTURE/input/bad.key" \
    || ! printf 'not a certificate\n' >"$SMOKE_FIXTURE/input/bad.crt"; then
    printf 'FAIL: could not write the corrupt fixture pair\n' >&2
    return 1
  fi
  smoke_wait_for_log 'conversion failed' \
    "a corrupt certificate pair appeared under /input but the watcher never logged 'conversion failed'"
  smoke_wait_for_log 'failed=1' \
    "the failed conversion was logged but no 'scan complete' summary counted failed=1"
  if [ -e "$SMOKE_FIXTURE/output/bad.pfx" ]; then
    printf 'FAIL: a corrupt input produced an artifact at /output/bad.pfx\n' >&2
    return 1
  fi
  smoke_wait_for_unhealthy \
    "health still passes after a failed conversion"

  # Recovery: health is level-based on the last scan, so removing the corrupt
  # pair must bring the marker back on the next scan with no restart.
  rm -f "$SMOKE_FIXTURE/input/bad.key" "$SMOKE_FIXTURE/input/bad.crt"
  smoke_wait_for_healthy \
    "the corrupt pair was removed but health did not recover on the next scan"

  # Every assertion above is silent on success, so name what was proved: a run
  # that drove a conversion and one whose hook returned early otherwise print the
  # same thing, leaving the harness's elapsed time unaccountable.
  printf 'cert-converter payload: the image converted the fixture pair into %s, which opened with PFX_PASSWORD and refused a wrong one, with health passing; a corrupt pair planted under /input was logged as a failed conversion, produced no artifact and failed health; removing it restored health without a restart\n' "$bundle"
}
