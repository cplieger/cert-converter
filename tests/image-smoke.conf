# Per-app config for the shared image-smoke harness (tests/image-smoke.sh,
# synced from cplieger/ci). cert-converter has no network listener, so this is
# a health-gated test: it waits for the container HEALTHCHECK
# (CMD ["/cert-watcher","health"], start-period 15s / interval 30s) to report
# "healthy" - proving the binary runs in the distroless base, loads its config,
# completes the initial scan, and writes the /tmp/.healthy marker its `health`
# subcommand probes.
SMOKE_APP_NAME=cert-converter
# Must cover the 15s start-period plus all three 30s healthcheck retries
# (~105s), so a container that never writes the marker is reported by the
# harness's precise "unhealthy" verdict instead of racing its deadline.
SMOKE_TIMEOUT=120
# PFX_PASSWORD: config.Load exits 1 on an empty password unless
# PFX_ALLOW_EMPTY_PASSWORD=true; the value itself is unused here (an empty
# /input converts nothing). --tmpfs /input and --tmpfs /output: both hardcoded
# roots are absent from the distroless image, and volumesReady (main.go) stats
# each one before the watcher starts and refuses to start when either is missing
# or is not a directory, so dropping either mount makes the container exit 1 at
# startup and the harness reports that early exit (with the ERROR naming the
# path) rather than waiting out SMOKE_TIMEOUT on a never-healthy container. With
# both mounted, the initial scan of an empty /input converts zero certs ->
# healthy, and the per-scan stale-temp reap walks an empty output tree (a no-op).
# --read-only + --cap-drop + --security-opt + --tmpfs /tmp: exercise the README's
# full "Hardened deployment" profile, so its one filesystem coupling (the
# /tmp/.healthy marker needing a writable /tmp once the rootfs is read-only) is
# proven rather than asserted, and a future capability dependency fails here
# instead of in the operator's copy of that block.
SMOKE_RUN_ARGS="-e PFX_PASSWORD=smoke-test --tmpfs /input --tmpfs /output --read-only --cap-drop ALL --security-opt no-new-privileges:true --tmpfs /tmp:size=1m,mode=1777,noexec,nosuid,nodev"
