# Alert rules for cert-converter as a Loki ruler (LogQL) group. This file is
# the alternative to alerts/promql.yaml, which holds the same alerts for a
# metric store: load one of the two, not both. Ship the container log to Loki
# and keep LOG_LEVEL at info, because the rules read the INFO `scan complete`
# record each scan writes. Change the `container` selector to the label your
# log collector sets. Thresholds, windows and severity labels are starting
# points. The 13h windows cover two scans at the default FALLBACK_SCAN_HOURS=6
# plus an hour; set them to twice your cadence plus an hour, or 50h when
# FALLBACK_SCAN_HOURS=0. CertConverterStartupRefused exists only in this file.
groups:
  - name: cert-converter
    rules:
      # Each state rule reads the latest `scan complete` record in the window,
      # so it fires at the first scan that sees the problem and resolves at the
      # first scan that does not. `| logfmt <field>` extracts that one field;
      # a bare `| logfmt` would turn every line into its own series.
      - alert: CertConverterConversionFailed
        expr: |
          last_over_time({container="cert-converter"} |= `scan complete` | logfmt failed | unwrap failed [13h]) by (container) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "cert-converter failed to convert a certificate"
          description: >
            The latest scan could not convert a source, so its output is stale
            or missing and the container is unhealthy. The `conversion failed`
            records name the file. Check ownership for the UID in `user:`, the
            PFX password and the chain.
      - alert: CertConverterOutputNameCollision
        expr: |
          last_over_time({container="cert-converter"} |= `scan complete` | logfmt collided | unwrap collided [13h]) by (container) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Two cert-converter inputs claim one output name, so neither converts"
          description: >
            Two inputs map to the same flat output path, so none of them converts
            and the container is unhealthy. The `output name collision` record
            names the path. Rename one input directory, or set OUTPUT_LAYOUT=mirror.
      - alert: CertConverterOutputWriteRefused
        expr: |
          last_over_time({container="cert-converter"} |= `scan complete` | logfmt unwritable | unwrap unwritable [13h]) by (container) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "cert-converter could not replace an output and left it as found"
          description: >
            An /output condition refused a write, so a consumer can keep reading
            a stale file. Health is unaffected, so this alert is the only signal.
            The record's `remediation` field names the action.
      - alert: CertConverterScanAborted
        expr: |
          last_over_time({container="cert-converter"} |= `scan complete` | logfmt aborted | unwrap aborted [13h]) by (container) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "cert-converter aborted a scan before completion"
          description: >
            The latest scan ended early, usually because /input or /output could
            not be opened or walked, and the container is unhealthy. The record's
            `error` field names the cause. Check both mounts and their permissions.
      - alert: CertConverterInputTreeTooLarge
        expr: |
          last_over_time({container="cert-converter"} |= `scan complete` | logfmt budget_stopped | unwrap budget_stopped [13h]) by (container) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "cert-converter stopped a scan at the /input entry budget"
          description: >
            The scan stopped at MAX_SCAN_ENTRIES, so every source past that point
            is unconverted. Health is unaffected. Check that /input holds only
            certificates. For a larger tree, raise MAX_SCAN_ENTRIES and the
            memory limit together.
      - alert: CertConverterChangeDetectionDegraded
        expr: |
          last_over_time({container="cert-converter"} |= `scan complete` | logfmt polling | unwrap polling [13h]) by (container) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "cert-converter is polling instead of watching for changes"
          description: >
            No file watch could be set up, so a renewal waits for the next
            rescan every FALLBACK_SCAN_HOURS. The alert holds while polling
            lasts. Exhausted inotify instances on the host are the usual cause.
      - alert: CertConverterInputPathUnreachable
        expr: |
          (
            last_over_time({container="cert-converter"} |= `scan complete` | logfmt unreadable | unwrap unreadable [13h]) by (container)
            + last_over_time({container="cert-converter"} |= `scan complete` | logfmt unresolved | unwrap unresolved [13h]) by (container)
          ) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "cert-converter skipped an unreachable /input path"
          description: >
            An /input path could not be read or a symlink could not be resolved,
            so its certificates were skipped. Health is unaffected. Fix
            permissions for the UID in `user:`, and mount the certificate
            directory instead of a symlink to it.
      - alert: CertConverterNoCertificateSources
        expr: |
          last_over_time({container="cert-converter"} |= `scan complete` | logfmt no_sources | unwrap no_sources [13h]) by (container) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "cert-converter found no certificate sources under /input"
          description: >
            A complete scan found no `.crt` and `.key` pair and no PFX or P12
            bundle, so nothing is produced. Health is unaffected. Check the
            /input mount and the source file names.
      - alert: CertConverterEverySourceExcluded
        expr: |
          last_over_time({container="cert-converter"} |= `scan complete` | logfmt all_excluded | unwrap all_excluded [13h]) by (container) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "cert-converter excluded every certificate source it found"
          description: >
            INPUT_EXCLUDE_PATHS covers every source under /input, so the scan
            converted nothing and reported no failure. Narrow the exclusion list,
            or point /input at the certificates you want.
      - alert: CertConverterOutputCleanupDegraded
        expr: |
          last_over_time({container="cert-converter"} |= `scan complete` | logfmt cleanup_degraded | unwrap cleanup_degraded [13h]) by (container) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "cert-converter cannot clean up stale /output temp files"
          description: >
            Leftover `.atomicfile-*.tmp` files under /output, each holding a
            private key, cannot be removed and will accumulate. Health is
            unaffected. Check /output ownership and permissions for the UID in
            `user:`.
      - alert: CertConverterOrphanRemovalDisabled
        expr: |
          last_over_time({container="cert-converter"} |= `scan complete` | logfmt orphan_removal_disabled | unwrap orphan_removal_disabled [13h]) by (container) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "cert-converter cannot remove orphaned /output artifacts"
          description: >
            The scan could not prove any output orphaned, so it removed nothing,
            and an output whose source is gone can stay served. Health is
            unaffected. The `orphan removal is disabled` record's `remediation`
            field names the action.
      - alert: CertConverterPreviousLayoutRetained
        expr: |
          last_over_time({container="cert-converter"} |= `scan complete` | logfmt previous_layout_retained | unwrap previous_layout_retained [13h]) by (container) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "cert-converter sync is keeping files from a previous OUTPUT_LAYOUT"
          description: >
            Sync kept files laid out for the other layout because OUTPUT_LAYOUT
            is unset. Repoint consumers at the current paths, then set
            OUTPUT_LAYOUT explicitly or remove the old tree by hand.
      # The deadman fires on silence: no scan ended in the window. It cannot
      # say why the stream went quiet, so its description names the causes.
      - alert: CertConverterScanStalled
        expr: |
          absent_over_time({container="cert-converter"} |= `scan complete` [13h])
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "No cert-converter scan finished in 13h"
          description: >
            No `scan complete` record arrived for two scan cadences. Rule out a
            stopped container, a stalled log pipeline and LOG_LEVEL above info,
            then restart it and check the host's inotify instance limit.
      # The event rules match the line the app writes as it exits: no record
      # follows, so there is no state to read.
      - alert: CertConverterChangeDetectionDead
        expr: |
          sum by (container) (count_over_time(
            {container="cert-converter"} |= `change detection is dead` [15m]
          )) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "cert-converter lost change detection and is exiting for a restart"
          description: >
            The watch loop ended outside shutdown, so the process exited for a
            restart. Without a restart policy, every renewal is missed. Set
            `restart: unless-stopped` and follow the record's `remediation`
            field when present.
      - alert: CertConverterStartupRefused
        expr: |
          sum by (container) (count_over_time(
            {container="cert-converter"} |~ `invalid configuration|refusing to start` [15m]
          )) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "cert-converter refused to start"
          description: >
            A setting is invalid or /input or /output is missing or unreadable,
            so the process exited before its first scan. The record's `error`
            field names the setting or the mount. Fix it and restart the container.
