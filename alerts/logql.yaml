# Recommended alert rules for cert-converter, as a Loki ruler (LogQL) group.
# cert-converter has no metrics endpoint, so ship its container logs to Loki
# and evaluate this group with Loki's ruler. Thresholds, windows and severity
# labels are starting points. Adjust the `container` selector to your
# deployment. Every rule keys on a WARN or ERROR record except
# CertConverterScanStalled, which needs LOG_LEVEL=info (the default).
# Per-alert notes are in docs/monitoring.md, under "Alerting".
groups:
  - name: cert-converter
    rules:
      # `!= (shutdown)` drops the same message when the container stopping
      # caused it. That case is logged at DEBUG.
      - alert: CertConverterConversionFailed
        expr: |
          sum by (container) (count_over_time(
            {container="cert-converter"}
            |= `conversion failed`
            != `(shutdown)` [15m]
          )) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "cert-converter failed to convert a certificate"
          description: >
            A parse, PFX decode, cert/key mismatch or write failure left a
            file stale or missing. The container stays unhealthy until
            a clean scan. Check /input and /output ownership for the UID in
            `user:`, the PFX password and the chain.
      - alert: CertConverterOutputNameCollision
        expr: |
          sum by (container) (count_over_time(
            {container="cert-converter"}
            |= `output name collision` [15m]
          )) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Two cert-converter inputs claim one output name, so neither converts"
          description: >
            Two inputs map to the same flat output path. None of them converts,
            the contested path is left as found and the container stays
            unhealthy. Rename one input directory, or set OUTPUT_LAYOUT=mirror.
            The record names the shared output.
      - alert: CertConverterOutputWriteRefused
        expr: |
          sum by (container) (count_over_time(
            {container="cert-converter"}
            |= `prior output could not be replaced` [15m]
          )) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "cert-converter could not write an output and left /output as found"
          description: >
            An /output condition refused a write, so a consumer can keep reading
            a stale file. Health is unaffected, so this rule is the only signal.
            The record's `remediation` field names the action and its `error`
            field names the path.
      - alert: CertConverterScanAborted
        expr: |
          sum by (container) (count_over_time(
            {container="cert-converter"} |= `scan aborted before completion` [15m]
          )) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "cert-converter aborted a scan before completion"
          description: >
            The /input root could not be walked, so the scan returned early and
            the container is unhealthy. Check the /input mount and its
            permissions, and look for an unmount during the scan.
      - alert: CertConverterInputTreeTooLarge
        expr: |
          sum by (container) (count_over_time(
            {container="cert-converter"}
            |= `holds more entries than one scan will enumerate` [15m]
          )) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "cert-converter stopped a scan at the /input entry budget"
          description: >
            The scan stopped at MAX_SCAN_ENTRIES, so every source past that
            point is unconverted. Health is unaffected, so this rule is the only
            signal. Check that /input holds only certificates. For a larger
            tree, raise MAX_SCAN_ENTRIES and the memory limit together.
      - alert: CertConverterChangeDetectionDegraded
        expr: |
          sum by (container) (count_over_time(
            {container="cert-converter"}
            |= `change detection scan` |= `mode=poll` [8h]
          )) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "cert-converter is polling instead of watching for changes"
          description: >
            No file watch could be set up, so a renewal waits for the next full
            rescan every FALLBACK_SCAN_HOURS. The alert stands while polling
            lasts. Exhausted inotify instances on the host are the usual cause.
      - alert: CertConverterChangeDetectionDead
        expr: |
          sum by (container) (count_over_time(
            {container="cert-converter"}
            |= `change detection is dead` [15m]
          )) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "cert-converter lost change detection and is exiting for a restart"
          description: >
            The watch loop ended outside shutdown, so the process exited for a
            restart. Without a restart policy, every renewal is missed. Set
            `restart: unless-stopped`, and follow the record's `remediation`
            field when present. The `error` field names the loss.
      # The deadman fires on silence. It needs LOG_LEVEL=info, because
      # `scan complete` is an INFO record. Size the window above `scan_floor`
      # from the startup line, so 30h when that floor is 24h.
      - alert: CertConverterScanStalled
        expr: |
          absent_over_time({container="cert-converter"} |= `scan complete` [8h])
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "No cert-converter scan completed in 8h"
          description: >
            No `scan complete` line arrived in 8h, so certificates may have
            stopped converting. First rule out a stopped container, a stalled
            log pipeline and LOG_LEVEL=warn. Then restart it and check the
            host's inotify instance limit.
      - alert: CertConverterInputPathUnreachable
        expr: |
          sum by (container) (count_over_time(
            {container="cert-converter"}
            |~ `(paths were unreadable|not be resolved through the input root|skipping cert: cannot)` [15m]
          )) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "cert-converter skipped an unreachable /input path"
          description: >
            An /input path could not be read or resolved, so its certificates
            were skipped. Health is unaffected, so this rule is the only signal.
            Fix permissions for the UID in `user:`. Mount the certificate
            directory, not a symlink to it.
      - alert: CertConverterNoCertificateSources
        expr: |
          sum by (container) (count_over_time(
            {container="cert-converter"}
            |~ `(no certificate (pairs|sources) found under the input root|certificate under the input root is missing its sibling \.key)` [15m]
          )) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "cert-converter found no certificate sources under /input"
          description: >
            A scan found no complete `.crt` and `.key` pair and no PFX or P12
            bundle, so nothing is produced. Health is unaffected, so this rule
            is the only signal. Check the /input mount and the source file names.
      - alert: CertConverterEverySourceExcluded
        expr: |
          sum by (container) (count_over_time(
            {container="cert-converter"}
            |= `every certificate source under the input root is excluded` [15m]
          )) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "cert-converter excluded every certificate source it found"
          description: >
            INPUT_EXCLUDE_PATHS covers every source under /input, so the scan
            converted nothing and reported no failure. This rule is the only
            signal. Narrow the exclusion list, or point /input at the
            certificates you want. Existing outputs are left untouched.
      - alert: CertConverterOutputCleanupDegraded
        expr: |
          sum by (container) (count_over_time(
            {container="cert-converter"}
            |~ `(stale temp cleanup failed|output temps could not be inspected|inspected during stale temp cleanup)` [15m]
          )) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "cert-converter cannot clean up stale /output temp files"
          description: >
            Leftover `.atomicfile-*.tmp` files under /output, each holding a
            private key, cannot be removed and will accumulate. Conversions may
            still succeed, so health is unaffected. Check /output ownership and
            permissions for the UID in `user:`.
      - alert: CertConverterOrphanRemovalDisabled
        expr: |
          sum by (container) (count_over_time(
            {container="cert-converter"}
            |~ `orphan removal is disabled for this scan` [15m]
          )) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "cert-converter cannot reap orphaned /output artifacts"
          description: >
            With OUTPUT_LIFECYCLE=sync, a scan could not prove a file is
            orphaned, so it removed nothing. An output whose source is gone can
            stay served. Health is unaffected. The record's `remediation` field
            names the action.
      - alert: CertConverterPreviousLayoutRetained
        expr: |
          sum by (container) (count_over_time(
            {container="cert-converter"}
            |= `laid out for a different OUTPUT_LAYOUT` [15m]
          )) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "cert-converter sync is keeping files from a previous OUTPUT_LAYOUT"
          description: >
            Sync kept files from a previous layout because OUTPUT_LAYOUT is
            unset. Repoint consumers at the current paths, then set
            OUTPUT_LAYOUT explicitly or remove the old tree by hand. Health is
            unaffected, so this rule is the only signal.
